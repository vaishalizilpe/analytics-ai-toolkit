name: evals

on:
  push:
  pull_request:
  workflow_dispatch:      # run the live eval on demand
  schedule:
    - cron: "0 16 * * 1"  # Mondays 16:00 UTC, weekly quality check

# Read-only by default. No job here writes to the repo, so nothing needs more.
permissions:
  contents: read

jobs:
  # Free on every push: unit-test the deterministic graders. No API key, no cost.
  grader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-graders.txt
      - run: pytest tests/test_evals_graders.py tests/test_stats.py -v

  # Costs API calls: run the full eval against the live model. Only on manual
  # dispatch or the weekly schedule, never on every push.
  live-eval:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Without a timeout a hung API call runs to GitHub's 6-hour default.
    timeout-minutes: 20
    # One paid run at a time: a manual dispatch during the weekly cron would
    # otherwise double the API spend and race on the uploaded artifact.
    concurrency:
      group: live-eval
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m evals.run_evals --judge
        env:
          LLM_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
